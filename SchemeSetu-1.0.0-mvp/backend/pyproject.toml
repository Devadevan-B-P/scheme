[project]
name = "backend"
version = "0.1.0"
description = "SchemeSetu - Two-Tiered Reasoning Platform for MoSJE Scheme Discovery"
readme = "README.md"
authors = [
    { name = "SchemeSetu Team" }
]
requires-python = ">=3.12"
dependencies = [
    "beanie>=2.2.0",
    "fastapi==0.141.1",
    "firecrawl-py>=4.42.0",
    "google-cloud-dlp==3.25.0",
    "google-genai==2.22.0",
    "motor>=3.7.1",
    "paddleocr==2.10.0",
    "paddlepaddle==3.3.1",
    "pdfplumber>=0.11.10",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pymongo==4.18.0",
    "pymupdf>=1.28.2",
    "python-dotenv==1.2.3",
    "python-multipart==0.0.9",
    "uvicorn[standard]>=0.30.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "strict"
